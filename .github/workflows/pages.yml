name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Build static frontend
        run: pnpm build:pages
        env:
          VITE_BASE_PATH: /VelvetHub/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OAUTH_PORTAL_URL: ${{ vars.VITE_OAUTH_PORTAL_URL }}
          VITE_APP_ID: ${{ vars.VITE_APP_ID }}
          VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ vars.VITE_ANALYTICS_WEBSITE_ID }}
      - name: Add SPA fallback
        run: |
          cp dist/public/index.html dist/public/404.html
          python3 - <<'PY'
          from pathlib import Path
          path = Path("dist/public/404.html")
          html = path.read_text()
          script = """<script>(function(){var base='/VelvetHub';var p=location.pathname.indexOf(base)===0?location.pathname.slice(base.length):location.pathname;if(p && p!=='/' && !p.endsWith('/404.html')){location.replace(base+'/#'+p+location.search)}})();</script>"""
          path.write_text(html.replace('</body>', script + '</body>'))
          PY
          touch dist/public/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
